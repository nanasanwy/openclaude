<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gate Simulator</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .lanes { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .gate { position: relative; height: 150px; border-radius: 12px; background: var(--surface-2); overflow: hidden; margin: 10px 0; }
    .gate .post { position: absolute; top: 20px; bottom: 20px; width: 22px; background: var(--muted); border-radius: 6px; }
    .gate .post.l { left: 18px; } .gate .post.r { right: 18px; }
    .gate .flap { position: absolute; top: 45px; height: 60px; width: calc(50% - 40px); background: color-mix(in srgb, var(--accent) 35%, transparent);
      border: 2px solid var(--accent); border-radius: 8px; transition: transform .35s ease; }
    .gate .flap.l { left: 40px; transform-origin: left center; } .gate .flap.r { right: 40px; transform-origin: right center; }
    .gate.open .flap.l { transform: perspective(300px) rotateY(80deg); }
    .gate.open .flap.r { transform: perspective(300px) rotateY(-80deg); }
    .gate .dir { position: absolute; bottom: 6px; width: 100%; text-align: center; font-size: .8rem; color: var(--muted); }
    .screen { border-radius: 12px; padding: 18px; text-align: center; font-weight: 800; font-size: 1.4rem; background: #1b1e24; color: #fff; min-height: 84px; display: flex; align-items: center; justify-content: center; }
    .screen.green { background: #0f8a3c; } .screen.red { background: #c0261b; } .screen.held { background: #b86e00; }
    .clock { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .band-group { border-top: 1px solid var(--border); padding: 10px 0; }
    .band-group:first-child { border-top: 0; }
    .band-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 4px 0; }
    .band-row .mono { flex: 1 1 110px; }
    .log { max-height: 320px; overflow-y: auto; font-size: .9rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <strong>Naru gate simulator</strong>
    <span class="badge warn">Test data only</span>
    <span class="spacer"></span>
    <a class="btn small" href="/" target="_blank">Staff app</a>
    <a class="btn small" href="/gate?lane=in" target="_blank">IN display</a>
    <a class="btn small" href="/gate?lane=out" target="_blank">OUT display</a>
  </header>
  <main class="stack" id="sim"></main>
  <script type="module" src="/sim.js"></script>
</body>
</html>
