<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gate Simulator</title>
  <link rel="icon" href="brand/naru-mark.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .lanes { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .gate { position: relative; height: 150px; border-radius: var(--radius-xl); background: var(--surface-mid); overflow: hidden; margin: 10px 0; }
    .gate .post { position: absolute; top: 20px; bottom: 20px; width: 22px; background: var(--outline); border-radius: 8px; }
    .gate .post.l { left: 18px; } .gate .post.r { right: 18px; }
    .gate .flap { position: absolute; top: 45px; height: 60px; width: calc(50% - 40px); background: rgba(168, 178, 125, 0.45);
      border: 2px solid var(--primary); border-radius: 10px; transition: transform .35s cubic-bezier(.4,0,.2,1); }
    .gate .flap.l { left: 40px; transform-origin: left center; } .gate .flap.r { right: 40px; transform-origin: right center; }
    .gate.open .flap.l { transform: perspective(300px) rotateY(80deg); }
    .gate.open .flap.r { transform: perspective(300px) rotateY(-80deg); }
    .gate .dir { position: absolute; bottom: 6px; width: 100%; text-align: center; font-size: .8rem; color: var(--ink-2); }
    /* Mirrors the guest gate screen: cream when waiting, olive open, red refused, terracotta held. */
    .screen { border-radius: var(--radius-xl); padding: 18px; text-align: center; font: 800 1.4rem/1.2 var(--font-display); background: var(--surface); color: var(--tertiary); min-height: 84px; display: flex; align-items: center; justify-content: center; }
    .screen.green { background: var(--primary); color: var(--surface); } .screen.red { background: var(--error); color: #fff; } .screen.held { background: var(--secondary); color: #fff; }
    .clock { font: 800 2.4rem/1.1 var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .band-group { padding: 12px 14px; border-radius: var(--radius-lg); background: var(--surface-low); }
    .band-groups { display: grid; gap: 8px; }
    .band-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 4px 0; }
    .band-row .mono { flex: 1 1 110px; }
    .log { max-height: 340px; overflow-y: auto; font-size: .9rem; }
    .topbar img { height: 28px; display: block; }
  </style>
</head>
<body>
  <header class="topbar">
    <img src="brand/naru-logo.png" alt="Naru Play Café">
    <strong>Gate simulator</strong>
    <span class="badge warn">Test data only</span>
    <span class="spacer"></span>
    <span class="row" id="sim-links">
      <a class="btn small" href="index.html" target="_blank">Staff app</a>
      <a class="btn small" href="gate.html?lane=in" target="_blank">IN display</a>
      <a class="btn small" href="gate.html?lane=out" target="_blank">OUT display</a>
    </span>
  </header>
  <main class="stack" id="sim"></main>
  <script type="module" src="sim.js"></script>
</body>
</html>
